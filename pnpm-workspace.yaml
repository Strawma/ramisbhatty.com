allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - core-js
  - esbuild
  - sharp
  - workerd

overrides:
  # Typography pins parser 6; its parsing and pseudo-selector APIs also work with patched 7.
  '@tailwindcss/typography>postcss-selector-parser@<7.1.6': '^7.1.6'
  # ESLint and typescript-eslint pin minimatch 10; their Minimatch and minimatch calls work with patched 11.
  'minimatch@>=7.0.0 <11.0.1': '^11.0.1'
