allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - core-js
  - esbuild
  - sharp
  - workerd

overrides:
  # Typography pins parser 6; its parsing and pseudo-selector APIs also work with patched 7.
  '@tailwindcss/typography>postcss-selector-parser@<7.1.6': '^7.1.6'
