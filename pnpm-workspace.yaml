allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - core-js
  - esbuild
  - sharp
  - workerd

overrides:
  # Miniflare pins an affected release; require the libheif security fix.
  'sharp@<0.35.4': '^0.35.4'
  # The Workers test pool's Miniflare still pins vulnerable undici 7.28.0.
  'undici@>=7.0.0 <7.29.0': '^7.29.0'
